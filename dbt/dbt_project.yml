name: 'ecommerce_dbt'
version: '1.0.0'
config-version: 2
profile: 'ecommerce_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # 증분 모델이 되돌아가 재집계할 일수. 지연 도착 데이터 흡수 목적.
  lookback_days: 3

models:
  ecommerce_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
